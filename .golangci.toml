version = '2'

[run]
go = '1.26.2'

[linters]
default = 'none'
enable = [
  'asasalint',
  'asciicheck',
  'bidichk',
  'bodyclose',
  'containedctx',
  'contextcheck',
  'copyloopvar',
  'decorder',
  'dogsled',
  'dupl',
  'dupword',
  'durationcheck',
  'errcheck',
  'errchkjson',
  'errname',
  'errorlint',
  'exhaustive',
  'exptostd',
  'fatcontext',
  'forbidigo',
  'forcetypeassert',
  'ginkgolinter',
  'gocheckcompilerdirectives',
  'gochecknoglobals',
  'gochecknoinits',
  'gocognit',
  'goconst',
  'gocritic',
  'gocyclo',
  'godot',
  'godox',
  'goheader',
  'gomoddirectives',
  'gomodguard',
  'goprintffuncname',
  'gosec',
  'gosmopolitan',
  'govet',
  'grouper',
  'importas',
  'ineffassign',
  'interfacebloat',
  'intrange',
  'lll',
  'loggercheck',
  'maintidx',
  'makezero',
  'mirror',
  'misspell',
  'mnd',
  'musttag',
  'nakedret',
  'nestif',
  'nilerr',
  'nilnil',
  'nlreturn',
  'noctx',
  'nolintlint',
  'nosprintfhostport',
  'perfsprint',
  'prealloc',
  'predeclared',
  'promlinter',
  'protogetter',
  'reassign',
  'revive',
  'rowserrcheck',
  'sloglint',
  'sqlclosecheck',
  'staticcheck',
  'testableexamples',
  'testpackage',
  'thelper',
  'tparallel',
  'unconvert',
  'unparam',
  'unused',
  'usestdlibvars',
  'wastedassign',
  'whitespace',
  'wsl_v5'
]

[linters.settings]
[linters.settings.depguard]
[linters.settings.depguard.rules]
[linters.settings.depguard.rules.main]
files = [
  '!**/*_a _file.go'
]
allow = [
  '$gostd',
  'github.com**'
]

[linters.settings.errcheck]
exclude-functions = [
  'io.WriteString',
  'io/ioutil.ReadFile',
  'io.Copy(*bytes.Buffer)',
  'io.Copy(os.Stdout)'
]

[linters.settings.funlen]
lines = -1
statements = 50

[linters.settings.mnd]
ignored-numbers = [
  '0666',
  '0755',
  '2',
  '3',
  '4',
  '5',
  '8',
  '10',
  '12',
  '13',
  '16',
  '20',
  '24',
  '32',
  '64',
  '100',
  '100.0',
  '128',
  '256',
  '512',
  '1024',
  '4096',
  '8192',
  '16384',
  '180',
  '180.0',
  '6371.0'
]

[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
use-field-name = true

[linters.settings.tagliatelle.case.rules]
json = 'snake'
xml = 'camel'
yaml = 'camel'

[linters.settings.varnamelen]
max-distance = 6
min-name-length = 2
check-receiver = true
check-return = true
check-type-param = true
ignore-names = [
  'err'
]
ignore-type-assert-ok = true
ignore-map-index-ok = true
ignore-chan-recv-ok = true
ignore-decls = [
  'b *bytes.Buffer',
  'e error',
  'i int',
  'j int',
  'f *flag.FlagSet',
  'f *os.File',
  'n int',
  'r rune',
  'r io.Reader',
  'r *csv.Reader',
  'r *http.Request',
  's string',
  's *goquery.Selection',
  'sb strings.Builder',
  'T any',
  't testing.T',
  't time.Time',
  'w io.Writer',
  'w *csv.Writer',
  'w http.ResponseWriter'
]

[linters.settings.wrapcheck]
ignore-sigs = [
  '.Errorf(',
  'errors.New(',
  'errors.Unwrap(',
  '.Wrap(',
  '.Wrapf(',
  '.WithMessage(',
  '.WithMessagef(',
  '.WithStack(',
  'func (context.Context).Err() error'
]
ignore-sig-regexps = [
  '\.New.*Error\('
]
ignore-package-globs = [
  'encoding/*',
  'github.com/pkg/*'
]
ignore-interface-regexps = [
  '^(?i)c(?-i)ach(ing|e)'
]

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2

[linters.exclusions]
generated = 'lax'
presets = [
  'comments',
  'common-false-positives',
  'legacy',
  'std-error-handling'
]

[[linters.exclusions.rules]]
linters = [
  'gosec'
]
text = 'G115' # integer overflow conversion

[[linters.exclusions.rules]]
linters = [
  'gosec'
]
text = 'G401' # Use of weak cryptographic primitive

[[linters.exclusions.rules]]
linters = [
  'gosec'
]
text = 'G404'

[[linters.exclusions.rules]]
linters = [
  'gosec'
]
text = 'G505' # Blocklisted import crypto/sha1: weak cryptographic primitive

[[linters.exclusions.rules]]
linters = [
  'perfsprint'
]
text = 'error-format: fmt.Errorf can be replaced with errors.New'

[formatters]
enable = [
  'gci',
  'gofmt',
  'gofumpt',
  'goimports'
]

[formatters.settings]
[formatters.settings.gci]
sections = [
  'standard',
  'default',
  'dot',
  'blank',
]
custom-order = true
